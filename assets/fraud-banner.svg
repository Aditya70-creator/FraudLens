    <text x="41" y="17" fill="#c084fc" text-anchor="middle">Python 3.11</text>

    <rect x="90" y="0" width="96" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="138" y="17" fill="#38bdf8" text-anchor="middle">Scikit-Learn</text>

    <rect x="194" y="0" width="64" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
    <text x="226" y="17" fill="#34d399" text-anchor="middle">SHAP</text>

    <rect x="266" y="0" width="74" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    <text x="303" y="17" fill="#e9d5ff" text-anchor="middle">FastAPI</text>

