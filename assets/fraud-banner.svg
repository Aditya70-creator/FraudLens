    <rect class="bar-risk" x="12" y="38" width="68" height="10" rx="5" fill="#f43f5e" />
    <rect class="bar-risk" x="12" y="58" width="52" height="10" rx="5" fill="#c084fc" />
    <rect class="bar-risk" x="12" y="78" width="78" height="10" rx="5" fill="#34d399" />
  </g>

  <circle cx="765" cy="125" r="74" fill="none" stroke="#2e1065" stroke-width="1.5" />
  <circle cx="765" cy="125" r="50" fill="none" stroke="#4c1d95" stroke-width="1" stroke-dasharray="4,4" />
  <circle class="pulse-ring" cx="765" cy="125" r="14" fill="none" stroke="#c084fc" stroke-width="2" />
  <circle cx="765" cy="125" r="11" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
